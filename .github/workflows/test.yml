name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Setup example directory
        run: bun run setup:example
      
      - name: Build
        run: bun run build
      
      - name: Run tests
        run: bun test
        env:
          SKIP_DEPENDENCY_CHECK: "1"
